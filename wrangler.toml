# ============================================================================
# ONCE UPON A TIME (OUAT) — CLOUDFLARE STATIC ASSETS DEPLOYMENT CONFIGURATION
# ============================================================================

name = "once-upon-a-lanka"
main = "cloudflare/worker.ts"
compatibility_date = "2026-03-01"

# ----------------------------------------------------------------------------
# AUTOMATIC BUILD HOOK
# Ensures `vite build` runs automatically whenever `npx wrangler deploy` executes.
# ----------------------------------------------------------------------------
[build]
command = "npm run build"

# ----------------------------------------------------------------------------
# STATIC ASSETS CONFIGURATION
# Serves the compiled React Vite frontend from dist/ with SPA client-side
# routing fallback for deep-links (/login, /signup, /dashboard, /discover, etc.)
# ----------------------------------------------------------------------------
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ----------------------------------------------------------------------------
# DURABLE OBJECTS CONFIGURATION
# Preserves MatchmakerDurableObject export required by Cloudflare deployment
# ----------------------------------------------------------------------------
[durable_objects]
bindings = [
  { name = "MATCHMAKER", class_name = "MatchmakerDurableObject" }
]

